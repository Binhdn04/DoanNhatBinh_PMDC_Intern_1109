<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">InternHub runtime architecture layers</title><desc id="desc">Six layers of the InternHub runtime architecture.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#475569}.name{font-size:23px;font-weight:700}.body{font-size:17px;fill:#334155}.num{font-size:30px;font-weight:700;fill:#fff}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="75" class="title">InternHub Runtime Architecture</text><text x="70" y="110" class="sub">Six layers and the allowed direction of dependencies</text>
  <rect x="100" y="170" width="1400" height="90" rx="18" fill="#dbeafe"/><circle cx="150" cy="215" r="27" fill="#2563eb"/><text x="142" y="226" class="num">1</text><text x="210" y="208" class="name">Client experience</text><text x="210" y="235" class="body">React SPA, feature screens, shared UI, session and query state</text>
  <rect x="100" y="280" width="1400" height="90" rx="18" fill="#e0e7ff"/><circle cx="150" cy="325" r="27" fill="#4f46e5"/><text x="142" y="336" class="num">2</text><text x="210" y="318" class="name">HTTP edge</text><text x="210" y="345" class="body">NestJS controllers, JWT guards, ownership checks, DTO validation and problem responses</text>
  <rect x="100" y="390" width="1400" height="90" rx="18" fill="#ede9fe"/><circle cx="150" cy="435" r="27" fill="#7c3aed"/><text x="142" y="446" class="num">3</text><text x="210" y="428" class="name">Application services</text><text x="210" y="455" class="body">Search, apply, status transition, task/report/feedback use cases and ports</text>
  <rect x="100" y="500" width="1400" height="90" rx="18" fill="#f3e8ff"/><circle cx="150" cy="545" r="27" fill="#9333ea"/><text x="142" y="556" class="num">4</text><text x="210" y="538" class="name">Domain</text><text x="210" y="565" class="body">Entities, policy rules, deterministic Match Score, state machines and domain events</text>
  <rect x="100" y="610" width="1400" height="90" rx="18" fill="#dcfce7"/><circle cx="150" cy="655" r="27" fill="#16a34a"/><text x="142" y="666" class="num">5</text><text x="210" y="648" class="name">Persistence and asynchronous execution</text><text x="210" y="675" class="body">PostgreSQL repositories, transactional outbox/jobs, worker leases, retry and dead-letter state</text>
  <rect x="100" y="720" width="1400" height="90" rx="18" fill="#fef3c7"/><circle cx="150" cy="765" r="27" fill="#d97706"/><text x="142" y="776" class="num">6</text><text x="210" y="758" class="name">External infrastructure</text><text x="210" y="785" class="body">Private object storage, LLM adapter, notification provider and observability sinks</text>
  <path d="M800 260V280M800 370V390M800 480V500M800 590V610M800 700V720" class="arrow"/>
</svg>
