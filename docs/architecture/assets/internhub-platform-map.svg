<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">InternHub platform map</title><desc id="desc">A platform map showing users, the InternHub web application, API, worker, data stores and external services.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:38px;font-weight:700}.subtitle{font-size:18px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:16px;fill:#334155}.label{font-size:15px;fill:#475569}.box{stroke-width:2;rx:16;ry:16}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="75" class="title">InternHub Platform Map</text><text x="70" y="110" class="subtitle">Target production architecture — user workflows, platform services, and external integrations</text>
  <rect x="70" y="205" width="270" height="360" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="105" y="250" class="head">People</text><text x="105" y="300" class="body">Student</text><text x="105" y="350" class="body">Company Staff</text><text x="105" y="400" class="body">Supervisor</text><text x="105" y="450" class="body">Admin</text><text x="105" y="510" class="label">All access over HTTPS</text>
  <rect x="480" y="150" width="690" height="590" class="box" fill="#fff" stroke="#2563eb"/><text x="515" y="200" class="head">InternHub platform</text>
  <rect x="535" y="245" width="235" height="125" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="565" y="290" class="head">Web SPA</text><text x="565" y="325" class="body">React / Vite</text>
  <rect x="850" y="245" width="255" height="125" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="880" y="290" class="head">API</text><text x="880" y="325" class="body">NestJS modular monolith</text>
  <rect x="535" y="475" width="235" height="130" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="565" y="520" class="head">Worker</text><text x="565" y="555" class="body">Jobs, retry, DLQ</text>
  <rect x="850" y="455" width="255" height="90" class="box" fill="#fef3c7" stroke="#d97706"/><text x="880" y="510" class="head">PostgreSQL</text>
  <rect x="850" y="590" width="255" height="90" class="box" fill="#fef3c7" stroke="#d97706"/><text x="880" y="645" class="head">Object storage</text>
  <rect x="1280" y="245" width="250" height="125" class="box" fill="#f1f5f9" stroke="#64748b"/><text x="1310" y="290" class="head">LLM provider</text><text x="1310" y="325" class="body">Optional enrichment</text>
  <rect x="1280" y="500" width="250" height="125" class="box" fill="#f1f5f9" stroke="#64748b"/><text x="1310" y="545" class="head">Notification provider</text><text x="1310" y="580" class="body">Email / delivery</text>
  <path d="M340 385H535" class="arrow"/><text x="390" y="365" class="label">HTTPS</text><path d="M770 307H850" class="arrow"/><text x="780" y="285" class="label">REST</text><path d="M975 370V455" class="arrow"/><path d="M850 500H770" class="arrow"/><text x="775" y="440" class="label">durable job</text><path d="M975 545V590" class="arrow"/><path d="M770 540H850" class="arrow"/><path d="M1105 307H1280" class="arrow"/><path d="M770 540H1215V562H1280" class="arrow"/>
  <text x="70" y="835" class="label">Principle: deterministic match score and core writes stay available even if AI or delivery providers fail.</text>
</svg>
