components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostingId:
      name: postingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlacementId:
      name: placementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AiJobId:
      name: aiJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Active role or record relationship is not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not exposed to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate resource, invalid lifecycle state, stale assignment/report
        version, or conflicting acceptance replay
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    PublishValidationError:
      description: Posting remains Draft; missing publish fields are identified
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  schemas:
    Role:
      type: string
      enum:
      - STUDENT
      - COMPANY_STAFF
      - SUPERVISOR
      - ADMIN
    WorkArrangement:
      type: string
      enum:
      - ONSITE
      - REMOTE
      - HYBRID
    PostingStatus:
      type: string
      enum:
      - DRAFT
      - OPEN
      - CLOSED
      - ARCHIVED
    ApplicationStatus:
      type: string
      enum:
      - SUBMITTED
      - UNDER_REVIEW
      - INTERVIEW
      - ACCEPTED
      - REJECTED
      - WITHDRAWN
    PlacementStatus:
      type: string
      enum:
      - ACTIVE
      - COMPLETED
      - TERMINATED
    TaskStatus:
      type: string
      enum:
      - TODO
      - IN_PROGRESS
      - DONE
    ReportState:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - REVISION_REQUESTED
      - APPROVED
    AssessmentState:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
    CompletionDecision:
      type: string
      enum:
      - PASSED
      - FAILED
      - PENDING
      - INCOMPLETE
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Date:
      type: string
      format: date
    ActiveRoleInput:
      type: object
      required:
      - activeRole
      properties:
        activeRole:
          $ref: '#/components/schemas/Role'
    RoleSession:
      type: object
      required:
      - me
      - accessToken
      - expiresAt
      properties:
        me:
          $ref: '#/components/schemas/Me'
        accessToken:
          type: string
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    Supervisor:
      type: object
      required:
      - id
      - fullName
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string
        department:
          type: string
    SupervisorPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Supervisor'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AssignmentChangeInput:
      type: object
      required:
      - expectedAssignmentId
      - supervisorUserId
      - reason
      properties:
        expectedAssignmentId:
          type: string
          format: uuid
          nullable: true
        supervisorUserId:
          type: string
          format: uuid
          nullable: true
          description: Null revokes without replacement.
        reason:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 2000
    SupervisorAssignment:
      type: object
      required:
      - id
      - supervisor
      - assignedAt
      - assignedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Id'
        supervisor:
          $ref: '#/components/schemas/Supervisor'
        assignedAt:
          $ref: '#/components/schemas/Timestamp'
        assignedByUserId:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
        revokedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedByUserId:
          $ref: '#/components/schemas/Id'
        revocationReason:
          type: string
    ReportingPeriod:
      type: object
      required:
      - id
      - placementId
      - weekStart
      - weekEnd
      - dueAt
      - timezone
      - submissionState
      properties:
        id:
          $ref: '#/components/schemas/Id'
        placementId:
          $ref: '#/components/schemas/Id'
        weekStart:
          $ref: '#/components/schemas/Date'
        weekEnd:
          $ref: '#/components/schemas/Date'
        dueAt:
          $ref: '#/components/schemas/Timestamp'
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        submissionState:
          type: string
          enum:
          - MISSING
          - DRAFT
          - SUBMITTED
          - REVISION_REQUESTED
          - APPROVED
          description: DRAFT is exposed only to owner; other participants see MISSING
            until first submission.
        reportId:
          $ref: '#/components/schemas/Id'
    Me:
      type: object
      required:
      - id
      - roles
      - activeRole
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        activeRole:
          $ref: '#/components/schemas/Role'
    StudentProfileInput:
      type: object
      required:
      - fullName
      - contactEmail
      - university
      - major
      properties:
        fullName:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 200
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 40
        university:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 200
        major:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 200
        graduationYear:
          type: integer
          minimum: 2000
          maximum: 2200
        bio:
          type: string
          maxLength: 5000
    StudentProfile:
      allOf:
      - $ref: '#/components/schemas/StudentProfileInput'
      - type: object
        required:
        - id
