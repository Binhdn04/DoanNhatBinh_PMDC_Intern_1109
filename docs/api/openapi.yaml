openapi: 3.0.3
info:
  title: InternHub API
  version: 1.0.0
  description: Implemented InternHub HTTP API. Optional AI is disabled. See target-openapi.yaml
    for deferred design proposals, not supported operations.
servers:
- url: /api/v1
  description: Same-origin production API
tags:
- name: Identity
- name: Students
- name: Documents
- name: Companies
- name: Postings
- name: Applications
- name: Placements
- name: Reports
- name: Evaluations
- name: Monitoring
- name: Notifications
- name: AI jobs
security:
- bearerAuth: []
paths:
  /auth/sign-in:
    post:
      tags:
      - Identity
      security: []
      summary: Create a local development session
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /auth/sign-out:
    post:
      tags:
      - Identity
      summary: Revoke the current local session
      operationId: signOut
      responses:
        '201':
          description: Session revoked
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /health:
    get:
      tags:
      - Identity
      security: []
      summary: Read API and deadline-scheduler freshness
      operationId: healthcheck
      responses:
        '200':
          description: API health with scheduler freshness
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /me:
    get:
      tags:
      - Identity
      summary: Get authenticated identity and permitted roles
      operationId: me
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /me/active-role:
    put:
      tags:
      - Identity
      summary: Select a permitted role and rotate the current session token
      description: Validate current user_roles; lock the session and increment its
        version when changing role. Old tokens for this session then return 401. Selecting
        the existing role is a no-op. Other sessions are unchanged. See identity protocol
        in arc42.
      operationId: setRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRoleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /students/me:
    get:
      tags:
      - Students
      summary: Get the current Student profile
      operationId: profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
    patch:
      tags:
      - Students
      summary: Update the current Student contact and education profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileInput'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /students/me/skills:
    get:
      tags:
      - Students
      summary: Reload the current Student skill set including stable skill IDs and
        optional proficiency
      operationId: getSkills
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSkill'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
    put:
      tags:
      - Students
      summary: Replace the current Student skill set
      operationId: setSkills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSkills'
      responses:
        '200':
          description: Saved skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSkill'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /students/me/preferences:
    get:
      tags:
      - Students
      summary: Get current Student career preferences
      operationId: getPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
    put:
      tags:
      - Students
      summary: Replace current Student career preferences
      operationId: setPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /postings:
    get:
      tags:
      - Postings
      summary: Discover eligible postings or list managed postings
      description: Student requests return only Open, non-expired postings. Company
        Staff and Admin receive records within their authorized management scope;
        `includeUnavailable` is ignored for Student discovery.
      operationId: postingsList
      responses:
        '200':
          description: Records. Paged collections return at most pageSize items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Posting'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: location
        in: query
        schema:
          type: string
      - name: workArrangement
        in: query
        schema:
          type: string
    post:
      tags:
      - Postings
      summary: Create a Draft posting
      operationId: createPosting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingInput'
      responses:
        '201':
          description: Draft posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posting'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /companies:
    get:
      tags:
      - Companies
      summary: List companies available to the active role
      operationId: listCompanies
      responses:
        '200':
          description: Records. Paged collections return at most pageSize items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /companies/{id}:
    get:
      tags:
      - Companies
      summary: Get a company profile
      operationId: company
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /postings/{id}:
    get:
      tags:
      - Postings
      summary: Get an authorized posting detail and, for Students, deterministic match
        breakdown
      operationId: getPosting
      responses:
        '200':
          description: Posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posting'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /postings/{id}/saved:
    put:
      tags:
      - Postings
      summary: Save an eligible posting once for the current Student
      operationId: savePosting
      responses:
        '200':
          description: Saved or already saved
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
      - Postings
      summary: Remove the current Student's saved posting
      operationId: unsave
      responses:
        '200':
          description: Removed
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /applications:
    post:
      tags:
      - Applications
      summary: Submit one application to an eligible posting
      operationId: apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
    get:
      tags:
      - Applications
      summary: List applications available to the active role
      operationId: applications
      responses:
        '200':
          description: Records. Paged collections return at most pageSize items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /applications/{id}:
    get:
      tags:
      - Applications
      summary: Get an authorized application, submission snapshot, documents, and
        immutable history
      operationId: application
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /applications/{id}/status:
    post:
      tags:
      - Applications
      summary: Move an application through an authorized staff/Admin transition
      description: Lock the application. From INTERVIEW, acceptance stores an immutable
        acceptance command and creates one placement, assignment, reporting calendar,
        history entry, and notification in one transaction. On ACCEPTED, an identical
        canonical supervisor/date/note command returns 200 with the existing placement
        link and no writes; different acceptance input returns 409 ACCEPTANCE_CONFLICT.
        Compare against the original command even after reassignment. Other terminal
        transitions return 409. Rejection is allowed from any staff-review non-terminal
        state.
      operationId: accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationStatusTransitionInput'
      responses:
        '201':
          description: Transition completed. Acceptance returns application and placement;
            identical retries return the same records.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Application'
                - type: object
                  required:
                  - application
                  - placement
                  properties:
                    application:
                      $ref: '#/components/schemas/Application'
                    placement:
                      $ref: '#/components/schemas/Placement'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /applications/{id}/withdraw:
    post:
      tags:
      - Applications
      summary: Withdraw the current Student's non-terminal application
      operationId: withdraw
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Withdrawn application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /supervisors:
    get:
      tags:
      - Placements
      summary: Find eligible supervisors for acceptance or Admin assignment management
      description: Supply exactly one applicationId or placementId. Own-company Staff/Admin
        may query an application; only Admin may query a placement. Eligibility means
        a user currently holds SUPERVISOR and a supervisor profile. No company or
        program restriction is imposed in v1. This lookup grants no placement access.
      operationId: supervisors
      responses:
        '200':
          description: Eligible supervisor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorPage'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: applicationId
        in: query
        schema:
          type: string
      - name: placementId
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
  /placements/{placementId}/supervisor-assignments:
    get:
      tags:
      - Placements
      summary: Get retained supervisor assignment history as Admin
      operationId: assignmentHistory
      responses:
        '200':
          description: Records. Paged collections return at most pageSize items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupervisorAssignment'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: placementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: changeAssignment
      responses:
        '200':
          description: Success
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      operationId: changeAssignment
      parameters:
      - name: placementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentChange'
  /documents:
    get:
      tags:
      - Documents
      summary: List reusable documents owned by the current Student
      operationId: listDocuments
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
    post:
      tags:
      - Documents
      summary: Start an authorized private-document upload
      operationId: beginDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: Upload authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUpload'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
  /documents/{documentId}/content:
    put:
      tags:
      - Documents
      summary: Stream document bytes through the API to private storage
      description: Only the owner of a PENDING document may upload. Token binds declared
        size, media type and digest. Limit 10 MiB; PDF, JPEG, PNG or DOCX only. Verify
        actual bytes, digest and signature before completion. Repeating the same bytes
        before completion is safe; AVAILABLE documents cannot be overwritten.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Bytes stored pending completion
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transferToken
        in: query
        required: true
        schema:
          type: string
    get:
      tags:
      - Documents
      summary: Stream an authorized AVAILABLE document through the API
      operationId: downloadDocument
      responses:
        '200':
          description: File bytes with safe Content-Disposition attachment filename
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transferToken
        in: query
        required: true
        schema:
          type: string
  /documents/{documentId}/complete:
    post:
      tags:
      - Documents
      summary: Finalize a private-document upload after API-mediated transfer
      description: Verify stored bytes against declared size and digest and supported
        file signatures. AVAILABLE completion retries return the same document; invalid
        bytes result in REJECTED. No browser storage transfer occurs.
      operationId: completeDocument
      responses:
        '201':
          description: Available document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /documents/{documentId}:
    delete:
      tags:
      - Documents
      summary: Remove a reusable document link when no draft or submitted record retains
        it
      operationId: deleteDocument
      responses:
        '204':
          description: Removed
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /documents/{documentId}/download-url:
    get:
      tags:
      - Documents
      summary: Issue a short-lived download URL for an authorized document
      operationId: downloadUrl
      responses:
        '200':
          description: Authorized URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /placements/{placementId}/reporting-periods:
    get:
      tags:
      - Reports
      summary: List canonical reporting weeks and deadlines including weeks with no
        report
      operationId: listPeriods
      responses:
        '200':
          description: Records. Paged collections return at most pageSize items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportingPeriod'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: placementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /placements/{placementId}/reports:
    get:
      tags:
      - Reports
      summary: List reports visible to the active role
      operationId: listReports
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyReport'
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: State conflict
      parameters:
      - name: placementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
      - Reports
      summary: Create the current Student's private draft for one reporting week
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDraftInput'
      responses:
        '201':
          description: Draft report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'
